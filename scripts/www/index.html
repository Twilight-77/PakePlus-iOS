<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>成语研习 · 人民网语境分析器（双栏整合版）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e6edf4 100%);
            font-family: 'Inter', system-ui, 'Segoe UI', Roboto, 'Noto Sans', 'PingFang SC', sans-serif;
            padding: 1.5rem;
            min-height: 100vh;
        }
        .app-wrapper { max-width: 1600px; margin: 0 auto; }
        .two-columns { display: flex; flex-wrap: wrap; gap: 1.8rem; }
        .learn-column { flex: 1.2; min-width: 320px; }
        .search-column { flex: 1.8; min-width: 360px; }

        /* 卡片样式（来自成语卡片） */
        .card-panel {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card {
            cursor: pointer;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .word { font-size: 2.5rem; font-weight: 700; color: #1e2f3e; margin-bottom: 1rem; }
        .meaning { font-size: 1.3rem; font-weight: 600; color: #1e4663; margin-bottom: 1rem; }
        .example { background: #f1f5f9; padding: 0.8rem; border-radius: 1.2rem; font-size: 0.9rem; text-align: left; border-left: 4px solid #3b82f6; }
        .confusable { background: #fff7e5; padding: 0.7rem; border-radius: 1rem; color: #b45309; margin-top: 0.75rem; font-size: 0.9rem; text-align: left; }
        .tags { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
        .tag { background: #e0e7ff; color: #3730a3; font-size: 0.7rem; padding: 0.2rem 0.8rem; border-radius: 30px; }
        .button-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; margin: 1.2rem 0 0.8rem; }
        button {
            background: white; border: none; padding: 0.5rem 1rem; border-radius: 40px;
            font-weight: 500; cursor: pointer; border: 1px solid #cbd5e1; transition: 0.2s;
        }
        button.primary { background: #1e4663; color: white; border: none; }
        button.warning { background: #fef9c3; color: #854d0e; }
        button.danger { background: #fee2e2; color: #b91c1c; }
        button.success { background: #d1fae5; color: #065f46; }
        button.secondary { background: #e6f0ff; color: #1e4663; }
        button:hover { transform: translateY(-2px); filter: brightness(0.96); }

        .mode-bar, .top-bar { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; align-items: center; justify-content: space-between; }
        .mode-buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .mode-btn.active { background: #1e4663; color: white; border: none; }
        .search-box { flex: 1; padding: 0.5rem 1rem; border-radius: 60px; border: 1px solid #cbd5e1; background: white; }
        .learn-options { background: #f1f5f9; padding: 0.2rem 0.8rem; border-radius: 40px; display: inline-flex; gap: 0.5rem; align-items: center; }
        .learn-options input[type="number"] { width: 55px; padding: 0.2rem; border-radius: 20px; border: 1px solid #cbd5e1; text-align: center; }

        /* 右侧搜索分析样式（完全复制独立版样式） */
        .search-header { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; margin-bottom: 1rem; }
        .analyze-control { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
        .search-result-list { max-height: 400px; overflow-y: auto; border-top: 1px solid #edf2f7; margin-top: 0.8rem; }
        .search-item { padding: 0.8rem; border-bottom: 1px solid #edf2f7; cursor: pointer; transition: background 0.1s; }
        .search-item:hover { background: #f8fafc; }
        .search-title { font-weight: 600; color: #0f172a; }
        .search-snippet { font-size: 0.8rem; color: #334155; margin-top: 0.3rem; }
        .keyword-highlight { background: #fff0f3; color: #c2410c; font-weight: 500; border-radius: 4px; padding: 0 2px; }
        .pagination { display: flex; justify-content: center; gap: 0.4rem; margin-top: 0.8rem; flex-wrap: wrap; }
        .page-btn { background: white; border: 1px solid #cbd5e1; padding: 0.2rem 0.7rem; border-radius: 2rem; cursor: pointer; font-size: 0.8rem; }
        .page-btn.active { background: #1e4663; color: white; }
        .analysis-box { background: #fefce8; border-radius: 1.5rem; padding: 1rem; margin-top: 1rem; max-height: 350px; overflow-y: auto; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.5; }
        .analysis-box h4 { margin-bottom: 0.5rem; color: #854d0e; }
        .loading { display: flex; align-items: center; gap: 0.5rem; justify-content: center; padding: 1rem; color: #2c5a8c; }
        .spinner { width: 20px; height: 20px; border: 2px solid #cbd5e1; border-top-color: #1e4663; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000;
            align-items: center; justify-content: center; backdrop-filter: blur(3px);
        }
        .modal-content { background: white; border-radius: 2rem; max-width: 1000px; width: 90%; max-height: 80vh; overflow: auto; padding: 1.5rem; }
        .card-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .card-table th, .card-table td { border: 1px solid #e2e8f0; padding: 0.5rem; text-align: left; vertical-align: top; }
        .badge-known { background: #d1fae5; color: #065f46; padding: 0.2rem 0.5rem; border-radius: 20px; }
        .badge-unknown { background: #fee2e2; color: #b91c1c; padding: 0.2rem 0.5rem; border-radius: 20px; }
        .delete-btn { background: #fee2e2; color: #b91c1c; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.7rem; border: none; cursor: pointer; }
        footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: #5a6e85; }
        @media (max-width: 900px) { .two-columns { flex-direction: column; } body { padding: 1rem; } }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div style="text-align:center; margin-bottom:1rem;">
        <h2 style="color:#1e2f3e;">📖 成语研习 · 人民网语境分析</h2>
        <p style="color:#5a6e85;">学习卡片 + 实时检索媒体用法 + AI 深度解读</p>
    </div>

    <div class="two-columns">
        <!-- 左侧：卡片学习区（完整保留原成语卡片功能） -->
        <div class="learn-column">
            <div class="card-panel">
                <div class="mode-bar">
                    <div class="mode-buttons">
                        <button id="allModeBtn" class="mode-btn active">📚 全部卡片</button>
                        <button id="unknownModeBtn" class="mode-btn">🔁 未掌握模式</button>
                        <button id="learnModeBtn" class="mode-btn secondary">🎓 AI批量生成
                            <span class="learn-options">
                                <label><input type="radio" name="learnType" value="成语" checked> 成语</label>
                                <label><input type="radio" name="learnType" value="词语"> 词语</label>
                                <input type="number" id="generateCount" min="1" max="15" value="3" style="width:55px;">
                            </span>
                        </button>
                        <button id="openManageBtn" class="mode-btn success">📋 管理卡片</button>
                    </div>
                    <div id="cardCountDisplay" style="background:white; padding:0.2rem 1rem; border-radius:40px;">📦 卡片: 0</div>
                </div>
                <div class="top-bar">
                    <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索词、释义或例句...">
                </div>
                <div id="cardContainer" class="card"><div>加载中...</div></div>
                <div class="button-group">
                    <button id="knowBtn" class="primary">✅ 认识</button>
                    <button id="unknownBtn" class="warning">❌ 不认识</button>
                    <button id="prevBtn">◀ 上一张</button>
                    <button id="nextBtn">下一张 ▶</button>
                    <button id="randomBtn">🎲 随机</button>
                    <button id="resetProgressBtn" class="danger">🔄 重置进度</button>
                </div>
            </div>
        </div>

        <!-- 右侧：人民网搜索 + AI 分析（完全复用独立版实现） -->
        <div class="search-column">
            <div class="card-panel" style="padding:1.2rem;">
                <div class="search-header">
                    <input type="text" id="searchKeywordInput" placeholder="输入要分析的词语 (默认为当前卡片词)" style="flex:2; padding:0.5rem 1rem; border-radius:60px; border:1px solid #cbd5e1;">
                    <button id="searchPeopleBtn" class="primary">🔍 人民网搜索</button>
                </div>
                <div class="analyze-control">
                    <span style="font-size:0.85rem;">分析前</span>
                    <input type="number" id="analyzePages" value="1" min="1" max="20" style="width:70px;">
                    <span style="font-size:0.85rem;">页</span>
                    <button id="analyzeMultiBtn" class="primary">✨ AI 综合分析</button>
                    <button id="copyAnalysisBtn" class="secondary">📋 复制解读</button>
                </div>
                <div style="display:flex; justify-content: space-between; align-items:center;">
                    <span><strong>📄 搜索结果</strong> <span id="searchResultCount">—</span></span>
                    <span><label style="font-size:0.7rem;">API Key: <input type="password" id="apiKeyInput" placeholder="DeepSeek Key" style="width:160px; padding:0.2rem;"></label>
                    <button id="saveApiBtn" style="padding:0.2rem 0.8rem;">保存</button></span>
                </div>
                <div id="searchResultList" class="search-result-list" style="min-height:200px;">
                    <div class="empty-state" style="text-align:center; padding:1rem;">点击上方搜索按钮获取人民网文章</div>
                </div>
                <div id="pagination" class="pagination" style="display:none;"></div>
                <div id="analysisArea" class="analysis-box" style="display:none;">
                    <h4>🧠 AI 语境解读</h4>
                    <div id="analysisContent"></div>
                </div>
                <div id="apiStatusMsg" style="font-size:0.7rem; margin-top:0.5rem; color:#2d6a4f;"></div>
            </div>
        </div>
    </div>

    <!-- 管理模态框 -->
    <div id="manageModal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
                <h3>📚 全部卡片管理</h3>
                <button id="closeManageBtn" style="background:none; border:none; font-size:1.8rem;">&times;</button>
            </div>
            <div style="display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap;">
                <button id="deduplicateBtn" class="warning">🔄 去重</button>
                <button id="exportPrintBtn" class="primary">🖨️ 导出/打印</button>
                <button id="deleteAllCardsBtn" class="danger">⚠️ 清空所有卡片</button>
            </div>
            <div style="overflow-x: auto; max-height: 60vh;">
                <table class="card-table">
                    <thead><tr><th>词目</th><th>释义</th><th>例句</th><th>易混辨析</th><th>标签</th><th>掌握状态</th><th>操作</th></tr></thead>
                    <tbody id="cardTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <footer>💡 点击卡片翻转 | 右侧自动同步当前卡片词进行搜索 | AI批量生成新词自动归入未掌握 | API Key 保存在本地</footer>
</div>

<script>
    // -------------------------------------------------------------
    // 1. 左侧成语卡片模块（完整保留，仅精简了部分与右侧冲突的变量）
    // -------------------------------------------------------------
    let cards = [];
    let unknownIds = [];
    let currentFilteredIds = [];
    let currentIndex = 0;
    let isFlipped = false;
    let unknownModeActive = false;
    let searchKeyword = "";
    let currentCardWord = "";

    // DOM 卡片相关
    const cardContainer = document.getElementById('cardContainer');
    const searchInput = document.getElementById('searchInput');
    const allModeBtn = document.getElementById('allModeBtn');
    const unknownModeBtn = document.getElementById('unknownModeBtn');
    const learnModeBtn = document.getElementById('learnModeBtn');
    const knowBtn = document.getElementById('knowBtn');
    const unknownBtn = document.getElementById('unknownBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const randomBtn = document.getElementById('randomBtn');
    const resetProgressBtn = document.getElementById('resetProgressBtn');
    const openManageBtn = document.getElementById('openManageBtn');
    const manageModal = document.getElementById('manageModal');
    const closeManageBtn = document.getElementById('closeManageBtn');
    const cardTableBody = document.getElementById('cardTableBody');
    const deduplicateBtn = document.getElementById('deduplicateBtn');
    const exportPrintBtn = document.getElementById('exportPrintBtn');
    const deleteAllCardsBtn = document.getElementById('deleteAllCardsBtn');
    const cardCountDisplay = document.getElementById('cardCountDisplay');
    const generateCountInput = document.getElementById('generateCount');

    const INITIAL_CARDS = [
        { id: 1, word: "南辕北辙", meaning: "行动和目的相反", example: "如果方法不对，再努力也是南辕北辙。", confusable: "背道而驰：方向完全相反", tags: ["易望文生义"] },
        { id: 2, word: "不刊之论", meaning: "正确、不可修改的言论", example: "他的见解可谓不刊之论。", confusable: "刊：削除修改", tags: ["易错字"] },
        { id: 3, word: "差强人意", meaning: "大体上还能让人满意", example: "这次表现差强人意。", confusable: "勿误解为‘不满意’", tags: ["易望文生义"] },
        { id: 4, word: "首当其冲", meaning: "最先受到攻击或灾难", example: "贸易战中，小企业首当其冲。", confusable: "冲：要冲", tags: ["高频误用"] },
        { id: 5, word: "万人空巷", meaning: "庆祝盛况人非常多", example: "夺冠后万人空巷。", confusable: "误为巷子空无一人", tags: ["易望文生义"] }
    ];

    function persistData() { localStorage.setItem('wordcard_data', JSON.stringify({ cards, unknownIds })); updateCardCount(); }
    function loadLocalData() {
        const raw = localStorage.getItem('wordcard_data');
        if (raw) { try { const data = JSON.parse(raw); cards = data.cards || []; unknownIds = data.unknownIds || []; } catch(e) { resetToInitial(); } }
        else { resetToInitial(); }
        if (!cards.length) resetToInitial();
        unknownIds = unknownIds.filter(id => cards.some(c => c.id === id));
        persistData();
        updateCardCount();
    }
    function resetToInitial() { cards = JSON.parse(JSON.stringify(INITIAL_CARDS)); unknownIds = []; persistData(); }
    function updateCardCount() { cardCountDisplay.innerText = `📦 卡片: ${cards.length}`; }

    function rebuildFilteredList() {
        let filtered = cards.filter(c => {
            if (searchKeyword.trim()) {
                const kw = searchKeyword.trim().toLowerCase();
                return c.word.toLowerCase().includes(kw) || c.meaning.toLowerCase().includes(kw) || c.example.toLowerCase().includes(kw);
            }
            return true;
        });
        if (unknownModeActive) filtered = filtered.filter(c => unknownIds.includes(c.id));
        currentFilteredIds = filtered.map(c => c.id);
        if (currentFilteredIds.length === 0) { renderEmptyState(); return; }
        if (currentIndex >= currentFilteredIds.length) currentIndex = currentFilteredIds.length-1;
        if (currentIndex < 0) currentIndex = 0;
        renderCurrentCard();
    }
    function getCurrentCard() { return cards.find(c => c.id === currentFilteredIds[currentIndex]); }
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function renderCurrentCard() {
        const card = getCurrentCard();
        if (!card) { renderEmptyState(); return; }
        currentCardWord = card.word;
        document.getElementById('searchKeywordInput').value = currentCardWord; // 同步到右侧
        if (!isFlipped) {
            cardContainer.innerHTML = `<div><div class="word">${escapeHtml(card.word)}</div><div class="tags">${(card.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div><div style="margin-top:1rem; font-size:0.8rem;">👆 点击查看详情</div></div>`;
        } else {
            cardContainer.innerHTML = `<div><div class="meaning">📖 ${escapeHtml(card.meaning)}</div><div class="example">📌 ${escapeHtml(card.example)}</div><div class="confusable">⚡ ${escapeHtml(card.confusable)}</div>${card.tags?.length ? `<div class="tags">🏷️ ${card.tags.map(escapeHtml).join(' · ')}</div>` : ''}</div>`;
        }
        cardContainer.onclick = () => { isFlipped = !isFlipped; renderCurrentCard(); };
    }
    function renderEmptyState() { cardContainer.innerHTML = `<div style="text-align:center;">📭 无匹配卡片</div>`; cardContainer.onclick = null; }
    function moveToNext() { if(currentFilteredIds.length){ currentIndex = (currentIndex+1)%currentFilteredIds.length; isFlipped=false; renderCurrentCard(); } }
    function moveToPrev() { if(currentFilteredIds.length){ currentIndex = (currentIndex-1+currentFilteredIds.length)%currentFilteredIds.length; isFlipped=false; renderCurrentCard(); } }
    function randomCard() { if(currentFilteredIds.length){ currentIndex = Math.floor(Math.random()*currentFilteredIds.length); isFlipped=false; renderCurrentCard(); } }
    function handleKnow() { const c = getCurrentCard(); if(c && unknownIds.includes(c.id)){ unknownIds = unknownIds.filter(id=>id!==c.id); persistData(); if(unknownModeActive) rebuildFilteredList(); else moveToNext(); } else { moveToNext(); } }
    function handleUnknown() { const c = getCurrentCard(); if(c && !unknownIds.includes(c.id)){ unknownIds.push(c.id); persistData(); } moveToNext(); if(unknownModeActive) rebuildFilteredList(); }
    function resetProgress() { unknownIds = []; persistData(); rebuildFilteredList(); isFlipped=false; }
    function onSearch() { searchKeyword = searchInput.value; currentIndex=0; isFlipped=false; rebuildFilteredList(); }
    function setModeAll() { unknownModeActive=false; allModeBtn.classList.add('active'); unknownModeBtn.classList.remove('active'); currentIndex=0; isFlipped=false; rebuildFilteredList(); }
    function setModeUnknown() { unknownModeActive=true; unknownModeBtn.classList.add('active'); allModeBtn.classList.remove('active'); currentIndex=0; isFlipped=false; rebuildFilteredList(); }

    // 管理模态框
    function renderManageTable() {
        if (!cardTableBody) return;
        cardTableBody.innerHTML = cards.map(card => {
            const isKnown = !unknownIds.includes(card.id);
            return `<tr>
                <td>${escapeHtml(card.word)}</td><td>${escapeHtml(card.meaning)}</td><td>${escapeHtml(card.example)}</td>
                <td>${escapeHtml(card.confusable)}</td><td>${(card.tags||[]).join(',')}</td>
                <td>${isKnown ? '<span class="badge-known">认识</span>' : '<span class="badge-unknown">不认识</span>'}</td>
                <td><button class="delete-btn" data-id="${card.id}">删除</button></td>
            </tr>`;
        }).join('');
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); if(confirm('删除？')){ cards = cards.filter(c=>c.id!==id); unknownIds = unknownIds.filter(uid=>uid!==id); persistData(); rebuildFilteredList(); renderManageTable(); } });
        });
    }
    function deleteAllCards() { if(confirm('⚠️ 清空所有卡片，不可撤销！')){ cards=[]; unknownIds=[]; persistData(); rebuildFilteredList(); renderManageTable(); } }
    function deduplicateCards() {
        const seen = new Map(); const unique = [];
        for(let card of cards){ const key=card.word.trim().toLowerCase(); if(!seen.has(key)){ seen.set(key,true); unique.push(card); } else { unknownIds = unknownIds.filter(id=>id!==card.id); } }
        if(unique.length!==cards.length){ cards=unique; persistData(); rebuildFilteredList(); renderManageTable(); apiStatusMsg.innerText=`去重完成，剩余${cards.length}张`; }
        else apiStatusMsg.innerText='无重复';
        setTimeout(()=>apiStatusMsg.innerText='',1500);
    }
    function exportForPrint() {
        const known = cards.filter(c=>!unknownIds.includes(c.id));
        const unknown = cards.filter(c=>unknownIds.includes(c.id));
        const win = window.open('','_blank');
        win.document.write(`<html><head><title>成语掌握表</title><style>body{font-family:system-ui;padding:2rem;} table{border-collapse:collapse;width:100%} th,td{border:1px solid #ccc;padding:0.5rem;}</style></head><body><h1>言语理解掌握表</h1><p>总数:${cards.length} 未掌握:${unknown.length} 已掌握:${known.length}</p><h3>未掌握</h3>${makeTable(unknown)}<h3>已掌握</h3>${makeTable(known)}</body></html>`);
        win.document.close(); win.print();
        function makeTable(arr){ if(!arr.length) return '<p>无</p>'; return `<table><tr><th>词语</th><th>释义</th><th>例句</th><th>易混</th></tr>${arr.map(c=>`<tr><td>${c.word}</td><td>${c.meaning}</td><td>${c.example}</td><td>${c.confusable}</td></tr>`).join('')}</table>`; }
    }

    // AI 批量生成（复用原有逻辑）
    let deepseekApiKey = localStorage.getItem('deepseek_api_key') || '';
    let selectedModel = 'deepseek-chat';
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiBtn = document.getElementById('saveApiBtn');
    async function generateSingleCardByType(type, retry=0) {
        const existingWords = cards.map(c=>c.word).join("、");
        const typeInstruction = type==="成语"? "生成一个常见易混成语（四字）" : "生成一个事业编言语理解常见易混词语（非成语）";
        const systemPrompt = `${typeInstruction}。不要重复以下词语：${existingWords || "无"}。只返回JSON：{"word":"词","meaning":"释义","example":"例句","confusable":"易混","tags":[]}`;
        const response = await fetch("https://api.deepseek.com/v1/chat/completions", {
            method:"POST", headers:{"Content-Type":"application/json","Authorization":`Bearer ${deepseekApiKey}`},
            body:JSON.stringify({model:selectedModel, messages:[{role:"user",content:systemPrompt}], temperature:0.8, response_format:{type:"json_object"}})
        });
        if(!response.ok) throw new Error(`API ${response.status}`);
        const data = await response.json();
        const parsed = JSON.parse(data.choices[0].message.content);
        if(cards.some(c=>c.word.trim().toLowerCase()===parsed.word.trim().toLowerCase()) && retry<2) return generateSingleCardByType(type, retry+1);
        return { word:parsed.word, meaning:parsed.meaning||"", example:parsed.example||"", confusable:parsed.confusable||"", tags:parsed.tags||[] };
    }
    async function startLearnMode() {
        if(!deepseekApiKey){ apiStatusMsg.innerText="请先填写并保存DeepSeek API Key"; return; }
        let count = parseInt(generateCountInput.value) || 1;
        if(count>20) count=20;
        const learnType = document.querySelector('input[name="learnType"]:checked').value;
        apiStatusMsg.innerText=`生成 ${count} 个${learnType}...`;
        learnModeBtn.disabled=true;
        let success=0;
        for(let i=0;i<count;i++){
            try{
                const cardData = await generateSingleCardByType(learnType);
                const newId = Math.max(...cards.map(c=>c.id),0)+1;
                cards.push({ id:newId, ...cardData });
                unknownIds.push(newId);
                success++;
                await new Promise(r=>setTimeout(r,500));
            }catch(e){ console.error(e); }
        }
        if(success) { persistData(); rebuildFilteredList(); setModeUnknown(); apiStatusMsg.innerText=`✅ 成功添加 ${success} 个新${learnType}`; }
        else apiStatusMsg.innerText="生成失败，请检查API Key";
        learnModeBtn.disabled=false;
    }

    // -------------------------------------------------------------
    // 2. 右侧人民网搜索 + AI 分析模块（完全照搬独立版，确保请求正常）
    // -------------------------------------------------------------
    const CORS_PROXY = "https://corsproxy.io/";
    const SEARCH_URL = "http://search.people.cn/search-platform/front/search";
    let currentSearchKeyword = "";
    let currentSearchPage = 1;
    let currentTotalPages = 1;
    let currentSearchRecords = [];

    // 完全使用独立版中验证过的 searchPeople 实现
    async function searchPeople(keyword, page = 1, limit = 10) {
        const payload = {
            key: keyword, page, limit, hasTitle: true, hasContent: true,
            isFuzzy: false, type: 0, sortType: 2, startTime: 0, endTime: 0, belongsId: []
        };
        try {
            const response = await fetch(CORS_PROXY, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    url: SEARCH_URL, method: "POST",
                    headers: { "Content-Type": "application/json", "User-Agent": "Mozilla/5.0" },
                    body: JSON.stringify(payload)
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } catch (err) {
            // fallback 直连（可能因CORS失败，但独立版中这一步极少执行）
            const directResp = await fetch(SEARCH_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            return await directResp.json();
        }
    }

    async function fetchPage(keyword, page) {
        const res = await searchPeople(keyword, page, 10);
        if (res?.code !== "0") throw new Error("搜索接口异常");
        return { records: res.data?.records || [], total: res.data?.total || 0 };
    }

    function stripEmTags(text){ return text? text.replace(/<\/?em>/gi, '') : ''; }
    function highlightKeyword(text, keyword) {
        if(!text || !keyword) return text;
        const re = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return text.replace(re, `<span class="keyword-highlight">$1</span>`);
    }

    async function performSearch() {
        let keyword = document.getElementById('searchKeywordInput').value.trim();
        if(!keyword){ apiStatusMsg.innerText="请输入搜索词"; return; }
        currentSearchKeyword = keyword;
        currentSearchPage = 1;
        document.getElementById('searchResultList').innerHTML = '<div class="loading"><div class="spinner"></div> 搜索中...</div>';
        try {
            const { records, total } = await fetchPage(keyword, 1);
            currentSearchRecords = records;
            renderSearchResults(records, keyword, total);
        } catch(e) { document.getElementById('searchResultList').innerHTML = `<div style="color:red;">搜索失败: ${e.message}</div>`; }
    }

    function renderSearchResults(records, keyword, total) {
        const container = document.getElementById('searchResultList');
        const countSpan = document.getElementById('searchResultCount');
        if(!records.length){ container.innerHTML = '<div class="empty-state">未找到相关文章</div>'; countSpan.innerText='0条'; document.getElementById('pagination').style.display='none'; return; }
        countSpan.innerText = `${total}条`;
        let html = '';
        for(let art of records){
            const title = stripEmTags(art.title || '无标题');
            const snippet = stripEmTags(art.content || '').slice(0, 200);
            html += `<div class="search-item" data-url="${art.url || '#'}">
                        <div class="search-title">${highlightKeyword(escapeHtml(title), keyword)}</div>
                        <div class="search-snippet">${highlightKeyword(escapeHtml(snippet), keyword)}…</div>
                    </div>`;
        }
        container.innerHTML = html;
        document.querySelectorAll('.search-item').forEach(el => {
            el.addEventListener('click', () => window.open(el.dataset.url, '_blank'));
        });
        // 分页
        const totalPages = Math.ceil(total / 10);
        currentTotalPages = totalPages;
        const pagDiv = document.getElementById('pagination');
        if(totalPages>1){
            pagDiv.style.display = 'flex';
            let btns = `<button class="page-btn" id="searchPagePrev">上一页</button>`;
            for(let i=1;i<=Math.min(totalPages,5);i++) btns+=`<button class="page-btn ${i===currentSearchPage?'active':''}" data-page="${i}">${i}</button>`;
            if(totalPages>5) btns+=`<span>...</span><button class="page-btn" data-page="${totalPages}">${totalPages}</button>`;
            btns+=`<button class="page-btn" id="searchPageNext">下一页</button>`;
            pagDiv.innerHTML = btns;
            document.querySelectorAll('.page-btn[data-page]').forEach(btn=>btn.addEventListener('click',()=>goToSearchPage(parseInt(btn.dataset.page))));
            document.getElementById('searchPagePrev')?.addEventListener('click',()=>goToSearchPage(currentSearchPage-1));
            document.getElementById('searchPageNext')?.addEventListener('click',()=>goToSearchPage(currentSearchPage+1));
        } else { pagDiv.style.display = 'none'; }
    }

    async function goToSearchPage(page){
        if(page<1 || page>currentTotalPages) return;
        currentSearchPage = page;
        document.getElementById('searchResultList').innerHTML = '<div class="loading"><div class="spinner"></div> 加载中...</div>';
        try {
            const { records, total } = await fetchPage(currentSearchKeyword, page);
            currentSearchRecords = records;
            renderSearchResults(records, currentSearchKeyword, total);
        } catch(e) { document.getElementById('searchResultList').innerHTML = `<div style="color:red;">加载失败</div>`; }
    }

async function analyzeMultiPages() {
    let keyword = document.getElementById('searchKeywordInput').value.trim();
    if(!keyword){ apiStatusMsg.innerText="请先搜索或输入词语"; return; }
    let pages = parseInt(document.getElementById('analyzePages').value) || 1;
    if(pages>20) pages=20;
    if(!deepseekApiKey){ apiStatusMsg.innerText="请填写DeepSeek API Key并保存"; return; }
    const analysisDiv = document.getElementById('analysisArea');
    const contentDiv = document.getElementById('analysisContent');
    analysisDiv.style.display = 'block';
    contentDiv.innerHTML = '<div class="loading"><div class="spinner"></div> 获取文章并分析中...</div>';
    let allContents = [];
    try {
        for(let p=1;p<=pages;p++){
            const { records } = await fetchPage(keyword, p);
            allContents.push(...records.map(r=>r.content).filter(c=>c));
            await new Promise(r=>setTimeout(r,300));
        }
        if(allContents.length===0) throw new Error("未获取到文章内容");
        const combined = allContents.map(c=>stripEmTags(c)).join("\n\n---\n\n").slice(0,14000);
        const prompt = `你是文本分析专家。关键词“${keyword}”。基于以下${allContents.length}篇文章片段，分析该词在人民网文章中的使用方式：搭配词语、语境主题、态度倾向、修辞特点。请结构化输出。请用纯文本段落形式输出，不要使用任何markdown符号（不要用#、*、-等）。请分段说明，最后给一个总结性的内容。\n\n片段：${combined}`;
        const resp = await fetch("https://api.deepseek.com/v1/chat/completions", {
            method:"POST", headers:{"Content-Type":"application/json","Authorization":`Bearer ${deepseekApiKey}`},
            body:JSON.stringify({ model:selectedModel, messages:[{role:"system",content:"专业助手"},{role:"user",content:prompt}], temperature:0.5, max_tokens:2000 })
        });
        const data = await resp.json();
        let analysis = data.choices[0].message.content;
        // 二次清洗防止残留符号
        analysis = analysis.replace(/#{2,}/g, '').replace(/\*{2,}/g, '').replace(/^[\*\-]\s+/gm, '');
        contentDiv.innerHTML = analysis.replace(/\n/g, '<br>');
        apiStatusMsg.innerText="分析完成";
    } catch(e) { contentDiv.innerHTML = `<span style="color:red;">分析失败: ${e.message}</span>`; }
}

    function copyAnalysis() {
        const text = document.getElementById('analysisContent').innerText;
        if(text && !text.includes("分析中")){ navigator.clipboard.writeText(text); apiStatusMsg.innerText="已复制分析"; setTimeout(()=>apiStatusMsg.innerText='',1000); }
        else apiStatusMsg.innerText="无分析内容可复制";
    }

    // -------------------------------------------------------------
    // 初始化 & 事件绑定
    // -------------------------------------------------------------
    function init() {
        loadLocalData();
        // API Key 初始化
        apiKeyInput.value = deepseekApiKey;
        saveApiBtn.onclick = () => { deepseekApiKey = apiKeyInput.value.trim(); localStorage.setItem('deepseek_api_key', deepseekApiKey); apiStatusMsg.innerText="API Key已保存"; setTimeout(()=>apiStatusMsg.innerText='',1500); };
        // 右侧按钮事件
        document.getElementById('searchPeopleBtn').onclick = performSearch;
        document.getElementById('analyzeMultiBtn').onclick = analyzeMultiPages;
        document.getElementById('copyAnalysisBtn').onclick = copyAnalysis;
        // 左侧卡片事件
        knowBtn.onclick = handleKnow;
        unknownBtn.onclick = handleUnknown;
        prevBtn.onclick = moveToPrev;
        nextBtn.onclick = moveToNext;
        randomBtn.onclick = randomCard;
        resetProgressBtn.onclick = resetProgress;
        searchInput.oninput = onSearch;
        allModeBtn.onclick = setModeAll;
        unknownModeBtn.onclick = setModeUnknown;
        learnModeBtn.onclick = startLearnMode;
        openManageBtn.onclick = () => { renderManageTable(); manageModal.style.display='flex'; };
        closeManageBtn.onclick = () => manageModal.style.display='none';
        deduplicateBtn.onclick = deduplicateCards;
        exportPrintBtn.onclick = exportForPrint;
        deleteAllCardsBtn.onclick = deleteAllCards;
        window.onclick = (e) => { if(e.target === manageModal) manageModal.style.display='none'; };
        rebuildFilteredList();
        // 卡片切换时同步右侧搜索框
        const observer = new MutationObserver(() => {
            const card = getCurrentCard();
            if(card) document.getElementById('searchKeywordInput').value = card.word;
        });
        observer.observe(cardContainer, { childList: true, subtree: true });
        document.getElementById('searchKeywordInput').value = getCurrentCard()?.word || '';
    }
    init();
</script>
